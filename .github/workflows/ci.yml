name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dev build (swiftc)
        run: ./scripts/build.sh
      - name: XcodeGen project builds
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project GPUDockHistory.xcodeproj \
            -scheme GPUDockHistory \
            -configuration Release \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build
