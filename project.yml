name: GPUDockHistory
options:
  bundleIdPrefix: com.bbirkinbine
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  GPUDockHistory:
    type: application
    platform: macOS
    sources:
      - Sources/GPUDockHistory
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbirkinbine.gpu-dock-history
        PRODUCT_NAME: GPU Dock History
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GPUDockHistory.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Full AppIcon set lives in Resources/Assets.xcassets. The dock tile is
        # drawn at runtime, but MAS/Finder/review still require a static icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple-Silicon-only: arm64 slice makes the Mac App Store restrict the
        # app to Apple Silicon (the runtime GPU-key dependency is invisible to
        # the store, so the architecture is the only lever). See
        # docs/ARCHITECTURE.md and docs/APP_STORE_PUBLISHING.md.
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # Apple Developer Team ID, required to archive for the App Store.
        # Safe to commit (it is public on every shipped binary); the signing
        # identity itself never lives in the repo. CI builds unsigned via
        # CODE_SIGNING_REQUIRED=NO, which overrides this.
        DEVELOPMENT_TEAM: G82L6VKCXZ
        CODE_SIGN_STYLE: Automatic
# Shared scheme so `xcodebuild -scheme GPUDockHistory` works on a fresh
# checkout (CI); without this XcodeGen writes no scheme files at all.
schemes:
  GPUDockHistory:
    build:
      targets:
        GPUDockHistory: all
